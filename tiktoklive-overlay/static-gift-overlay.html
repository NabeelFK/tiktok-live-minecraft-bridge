<!DOCTYPE html>
<!--
  Static gift overlay for TikTok LIVE Studio.

  This is a separate alternative to gift-overlay.html. It never rotates or scrolls:
  every advertised gift stays visible in one 16:9-friendly board.

  Keep the GIFTS array below in sync with gift-map.ts. Gift availability and prices
  vary by region, so replace the sample list with the gifts in the intended live room.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static gift overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --slate: #1b1d23;
    --slate-lift: #262932;
    --slate-soft: #20232b;
    --harm: #e03131;
    --help: #37b24d;
    --text: #f2f3f5;
    --text-dim: #a7acb5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(10px, 1.7vh, 20px);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .board {
    width: min(1660px, 100%);
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.16);
    background: rgba(16, 18, 23, .95);
    box-shadow: 0 16px 48px rgba(0,0,0,.58);
  }

  .header {
    min-height: clamp(48px, 7.4vh, 78px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: clamp(9px, 1.4vh, 16px) clamp(14px, 1.5vw, 24px);
    border-bottom: 2px solid rgba(255,255,255,.13);
    background: linear-gradient(90deg, #20232b, #191b21);
  }

  .title {
    font-family: Silkscreen, monospace;
    font-size: clamp(18px, 2.7vh, 30px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: .02em;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: clamp(16px, 1.5vw, 26px);
    flex: 0 0 auto;
    font-family: Silkscreen, monospace;
    font-size: clamp(14px, 1.9vh, 20px);
    font-weight: 700;
  }

  .legend span { display: flex; align-items: center; gap: clamp(8px, .7vw, 12px); }
  .legend i {
    width: clamp(18px, 2.4vh, 26px);
    height: clamp(18px, 2.4vh, 26px);
    display: block;
    box-shadow: 0 0 0 2px rgba(255,255,255,.14);
  }
  .legend .helps i { background: var(--help); }
  .legend .hurts i { background: var(--harm); }

  .grid {
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: clamp(4px, .65vh, 8px);
    padding: clamp(6px, .9vh, 11px);
  }

  .card {
    min-width: 0;
    min-height: 0;
    position: relative;
    display: grid;
    grid-template-columns: clamp(40px, 5.5vh, 58px) minmax(0, 1fr);
    align-items: center;
    gap: clamp(7px, .7vw, 12px);
    overflow: hidden;
    padding: clamp(6px, .9vh, 10px) clamp(8px, .8vw, 13px);
    border: 1px solid rgba(255,255,255,.08);
    border-left: clamp(4px, .45vw, 7px) solid var(--harm);
    background: var(--slate-soft);
    box-shadow: 0 2px 8px rgba(0,0,0,.24);
  }

  .card[data-kind="help"] { border-left-color: var(--help); }

  /* With 22 entries in a four-column grid, center the final pair. */
  .card:nth-child(21) { grid-column: 2; }

  .icon,
  .icon-fallback {
    width: clamp(40px, 5.5vh, 58px);
    height: clamp(40px, 5.5vh, 58px);
  }

  .icon {
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
  }

  .icon-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    background: var(--slate-lift);
    font: 9px/1.1 Silkscreen, monospace;
    text-align: center;
  }

  .copy { min-width: 0; }

  .giftline {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
    margin-top: clamp(2px, .35vh, 4px);
  }

  .giftname {
    min-width: 0;
    overflow: hidden;
    color: var(--text);
    font-family: Silkscreen, monospace;
    font-size: clamp(13px, 1.9vh, 20px);
    font-weight: 800;
    line-height: 1.1;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .blurb {
    margin-top: clamp(5px, .65vh, 8px);
    overflow: hidden;
    color: var(--text-dim);
    display: -webkit-box;
    font-size: clamp(13px, 1.8vh, 19px);
    font-weight: 600;
    line-height: 1.18;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
  }

  @media (max-aspect-ratio: 4/3) {
    .grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
    }
    .card:nth-child(21) { grid-column: auto; }
    .card:nth-child(22) { grid-column: 2; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<main class="board">
  <header class="header">
    <div>
      <h1 class="title">GIFTS CONTROL THE GAME</h1>
    </div>
    <div class="legend" aria-label="Gift effect legend">
      <span class="helps"><i></i>HELPS</span>
      <span class="hurts"><i></i>HURTS</span>
    </div>
  </header>
  <section class="grid" id="grid" aria-label="Gift effects"></section>
</main>

<script>
const GIFTS = [
  { name: 'Rose',                coins: 1,    icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp', effect: 'TNT',             blurb: 'Drops primed TNT on me with only 3 seconds to escape.', kind: 'harm' },
  { name: 'TikTok',              coins: 1,    icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/802a21ae29f9fae5abe3693de9f874bd~tplv-obj.webp', effect: 'STRIKE',          blurb: 'Strikes me with lightning exactly where I am standing.', kind: 'harm' },
  { name: 'GG',                  coins: 1,    icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/3f02fa9594bd1495ff4e8aa5ae265eef~tplv-obj.webp', effect: 'WEBBED',          blurb: 'Places a cobweb on me, trapping me until I break free.', kind: 'harm' },
  { name: 'Ice Cream Cone',      coins: 1,    icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/968820bc85e274713c795a6aef3f7c67~tplv-obj.webp', effect: 'WOOZY',           blurb: 'Gives me nausea for 15 seconds and makes my screen spin.', kind: 'harm' },
  { name: 'Heart Me',            coins: 1,    icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/composed.b326356a360b67b367c5cae58fe337b1.png~tplv-obj.webp', effect: 'GOLDEN APPLE',    blurb: 'Gives me a golden apple for healing and absorption.', kind: 'help' },
  { name: 'Finger Heart',        coins: 5,    icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp', effect: 'SLUDGE',          blurb: 'Gives Mining Fatigue III and Slowness II for 20 seconds.', kind: 'harm' },
  { name: 'BFF Necklace',        coins: 10,   icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/e033c3f28632e233bebac1668ff66a2f.png~tplv-obj.webp', effect: 'LAUNCHED',        blurb: 'Launches me upward and gives Resistance so the landing will not hurt.', kind: 'harm' },
  { name: 'Perfume',             coins: 20,   icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/20b8f61246c7b6032777bb81bf4ee055~tplv-obj.webp', effect: 'FLOAT',           blurb: 'Makes me levitate for 20 seconds, then drops me back down.', kind: 'harm' },
  { name: 'Doughnut',            coins: 30,   icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp', effect: 'BLACKOUT',        blurb: 'Blinds me for 10 seconds and surrounds me with 6 hostile mobs.', kind: 'harm' },
  { name: 'Paper Crane',         coins: 99,   icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/0f158a08f7886189cdabf496e8a07c21~tplv-obj.webp', effect: 'UPROOTED',        blurb: 'Teleports me 60–120 blocks off course in a random direction.', kind: 'harm' },
  { name: 'Hat and Mustache',    coins: 99,   icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/2f1e4f3f5c728ffbfa35705b480fdc92~tplv-obj.webp', effect: 'HOTBAR WIPED',    blurb: 'Deletes all 9 hotbar slots; items stored in my backpack survive.', kind: 'harm' },
  { name: 'Hand Heart',          coins: 100,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/6cd022271dc4669d182cad856384870f~tplv-obj.webp', effect: 'BURIED',          blurb: 'Drops me 12 blocks underground, then seals the opening with stone.', kind: 'harm' },
  { name: 'Flowers',             coins: 100,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/697bf9450c55c2ee569c8e8b2cab7152~tplv-obj.webp', effect: 'SECOND WIND',     blurb: 'Gives Regeneration IV for 60 seconds to rapidly heal me.', kind: 'help' },
  { name: 'Love You',            coins: 199,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/134e51c00f46e01976399883ca4e4798~tplv-obj.webp', effect: 'GEAR GONE',       blurb: 'Deletes all armor plus every tool, weapon, shield and elytra I carry.', kind: 'harm' },
  { name: 'Balloons',            coins: 200,  icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/c370d5c4ab6e5971b6b17de3eab6f6d4.png~tplv-obj.webp', effect: 'FLOOR GONE',      blurb: 'Removes a 5×12×5 shaft beneath me, dropping me straight down.', kind: 'harm' },
  { name: 'Corgi',               coins: 299,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/148eef0884fdb12058d1c6897d1e02b9~tplv-obj.webp', effect: 'RELOCATED',       blurb: 'Teleports me 150–400 blocks away in a random direction.', kind: 'harm' },
  { name: 'Cello Romance',       coins: 299,  icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/4756a2a4604d2cb5bb5b0639b259e9b5.png~tplv-obj.webp', effect: 'DIAMOND KIT',     blurb: 'Gives diamond armor, sword, pickaxe, 3 totems, 32 gapples, logs and 12 Eyes.', kind: 'help' },
  { name: 'Money Gun',           coins: 500,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/e0589e95a2b41970f0f30f6202f5fce6~tplv-obj.webp', effect: 'INVENTORY WIPED', blurb: 'Deletes my entire inventory, including armor and offhand items.', kind: 'harm' },
  { name: 'Swan',                coins: 699,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/97a26919dbf6afe262c97e22a83f4bf1~tplv-obj.webp', effect: 'NETHERITE KIT',   blurb: 'Gives a Netherite kit, 5 totems, 64 gapples, logs, 8 beds and 12 Eyes.', kind: 'help' },
  { name: 'Train',               coins: 899,  icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4227ed71f2c494b554f9cbe2147d4899~tplv-obj.webp', effect: 'SKY DIVE',        blurb: 'Teleports me 120 blocks straight into the sky with no safe landing.', kind: 'harm' },
  { name: 'Galaxy',              coins: 1000, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/79a02148079526539f7599150da9fd28.png~tplv-obj.webp', effect: 'WARDEN',          blurb: 'Spawns a Warden beside me and gives Darkness for 20 seconds.', kind: 'harm' },
  { name: 'Sports Car',          coins: 7000, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/e7ce188da898772f18aaffe49a7bd7db~tplv-obj.webp', effect: 'THE FINALE',      blurb: 'Protects and launches me, then surrounds me with lightning and 20 Withers.', kind: 'harm' },
];

const grid = document.getElementById('grid');
const DISPLAY_GIFTS = [
  ...GIFTS.filter(gift => gift.kind === 'help'),
  ...GIFTS.filter(gift => gift.kind === 'harm'),
];

for (const gift of DISPLAY_GIFTS) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.kind = gift.kind;

  const icon = document.createElement('img');
  icon.className = 'icon';
  icon.src = gift.icon;
  icon.alt = '';
  icon.addEventListener('error', () => {
    const fallback = document.createElement('div');
    fallback.className = 'icon-fallback';
    fallback.textContent = 'NO ICON';
    icon.replaceWith(fallback);
  }, { once: true });

  const copy = document.createElement('div');
  copy.className = 'copy';

  const giftLine = document.createElement('div');
  giftLine.className = 'giftline';

  const name = document.createElement('div');
  name.className = 'giftname';
  name.textContent = gift.name;

  const blurb = document.createElement('div');
  blurb.className = 'blurb';
  blurb.textContent = gift.blurb;

  giftLine.append(name);
  copy.append(giftLine, blurb);
  card.append(icon, copy);
  grid.append(card);
}
</script>
</body>
</html>
